# =============================================================================
# ec20-gateway configuration (installed as /etc/ec20-gateway.conf, chmod 600)
# Flat key=value; parse with:  grep -E '^KEY=' file | cut -d= -f2-
# Editable from the web panel (Config page).
# =============================================================================

# ---- web panel --------------------------------------------------------------
WEB_BIND=__WEB_BIND__
WEB_PORT=__WEB_PORT__
WEB_PASS_HASH=__WEB_PASS_HASH__
WEB_SESSION_SECRET=__WEB_SESSION_SECRET__

# ---- DingTalk robot (security type: 加签 / HMAC sign) -----------------------
# ENABLE_DINGTALK=auto -> enabled iff DINGTALK_WEBHOOK is non-empty
ENABLE_DINGTALK=auto
DINGTALK_WEBHOOK=__DINGTALK_WEBHOOK__
DINGTALK_SECRET=__DINGTALK_SECRET__

# ---- email (msmtp, /etc/msmtprc) ---------------------------------------------
ENABLE_EMAIL=auto
EMAIL_TO=__EMAIL_TO__

# ---- missed incoming call notification (uses the same channels) --------------
ENABLE_MISSED_CALL=yes

# ---- modem -------------------------------------------------------------------
DEV_NAME=ec20
# audio DSP profile: 3 = raw PCM (fixes garbled/one-way audio on many units)
# 0 = handset profile (EC+NS on) -- try when remote side is too quiet
QAUDMOD_MODE=__QAUDMOD__

# ---- paths -------------------------------------------------------------------
LOG_FILE=/var/log/ec20-gateway.log
INBOX_FILE=/var/lib/ec20-gateway/inbox.jsonl
