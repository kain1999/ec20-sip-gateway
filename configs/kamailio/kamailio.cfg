# =============================================================================
# ec20-sip-gateway :: Kamailio 5.3 (Ubuntu 20.04) — registrar / router
#
# Role split on a 500MB board:
#   Kamailio : REGISTER (digest auth, SQLite), extension routing, PSTN dispatch
#   Asterisk : media gateway only, reachable at 127.0.0.1:5062 (dispatcher)
#
# Extension numbering: 1XXX (4 digits starting with 1) are internal extensions
# resolved from the location table; everything else numeric goes to Asterisk.
# =============================================================================
#!KAMAILIO

debug=1
log_stderror=no
log_facility=LOG_LOCAL0
log_name="kamailio"
fork=yes
children=2
tcp_children=0
disable_tcp=yes
disable_tls=yes
auto_aliases=no

listen=udp:0.0.0.0:5060

# ------------------------------------------------------------------ modules --
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "siputils.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_sqlite.so"
loadmodule "nathelper.so"
loadmodule "dispatcher.so"

# ------------------------------------------------------------- module params --
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 10000)
modparam("tm", "fr_inv_timer", 45000)

modparam("rr", "append_fromtag", 1)

# location table: memory only (few contacts, zero disk IO)
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 0)

# digest auth against SQLite subscriber table (plaintext password + ha1 calc)
modparam("auth_db", "db_url", "sqlite:////etc/kamailio/kamailio.db")
modparam("auth_db", "user_column", "username")
modparam("auth_db", "password_column", "password")
modparam("auth_db", "domain_column", "domain")
modparam("auth_db", "calculate_ha1", 1)
# match username only (To/From domain is the board IP, subscriber rows say ec20-gw)
modparam("auth_db", "use_domain", 0)

# single media gateway: Asterisk on loopback
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 15)
modparam("dispatcher", "ds_probing_mode", 1)

# ---------------------------------------------------------- routing blocks ---
request_route {
	route(REQINIT);

	# in-dialog requests: route on top of RR set
	if (has_totag()) {
		route(WITHINDLG);
		exit;
	}

	# ---- initial requests ----
	record_route();

	if (is_method("REGISTER")) {
		route(REGISTER);
		exit;
	}

	# trusted peer: Asterisk sending cellular-incoming calls / reports
	if ($si == "127.0.0.1" && $sp == 5062) {
		route(FROMASTERISK);
		exit;
	}

	if (is_method("INVITE|MESSAGE")) {
		route(AUTH);
		route(ROUTE_TARGET);
		exit;
	}

	sl_send_reply("405", "Method Not Allowed");
	exit;
}

route[REQINIT] {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
		exit;
	}
	if (msg:len >= 16384) {
		sl_send_reply("513", "Message Too Big");
		exit;
	}
}

route[WITHINDLG] {
	if (is_method("BYE")) {
		setflag(1);
	}
	t_relay();
	exit;
}

route[REGISTER] {
	# NAT: public softphones register through tunnels/Internet — rewrite the
	# Contact to the source ip:port (rport) so lookups reach the real device.
	force_rport();
	if (nat_uac_test("18")) {
		fix_nated_register();
	}
	# digest challenge; realm must match softphone config: ec20-gw
	if (!www_authorize("ec20-gw", "subscriber")) {
		www_challenge("ec20-gw", "0");
		exit;
	}
	if (!save("location")) {
		sl_reply_error();
		exit;
	}
	xlog("L_INFO", "REGISTER ok: $fU from $si:$sp\n");
}

route[AUTH] {
	# only registered extensions may call out / message out
	if (!registered("location", "$fu")) {
		sl_send_reply("403", "Register first");
		exit;
	}
}

route[FROMASTERISK] {
	# cellular incoming call (INVITE) or anything else from the gateway
	if (is_method("INVITE|MESSAGE")) {
		if (!lookup("location")) {
			sl_send_reply("404", "Extension Not Registered");
			exit;
		}
		record_route();
		route(RELAY);
		exit;
	}
	sl_send_reply("405", "Method Not Allowed");
	exit;
}

route[ROUTE_TARGET] {
	if ($rU =~ "^1[0-9]{3}$") {
		# extension-to-extension: Kamailio routes directly, no Asterisk media
		if (!lookup("location")) {
			sl_send_reply("404", "Extension Not Found");
			exit;
		}
	} else if ($rU =~ "^\+?[0-9]{3,20}$") {
		# PSTN number: dispatch to Asterisk media gateway (EC20)
		if (!ds_select_dst("1", "4")) {
			sl_send_reply("503", "Media Gateway Unavailable");
			exit;
		}
		xlog("L_INFO", "PSTN $rm $rU -> $du\n");
	} else {
		sl_send_reply("403", "Invalid Destination");
		exit;
	}
	route(RELAY);
	exit;
}

route[RELAY] {
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# ---------------------------------------------------------------- event_route -
event_route[xlog:alert] {
	xlog("L_ALERT", "ALERT: [$fu|$fU|$si:$sp]\n");
}
