; =============================================================================
; ec20-sip-gateway :: dialplan
;
; Context map
;   from-kamailio : PSTN-number INVITE relayed by Kamailio -> dial out via EC20
;   from-quectel  : cellular incoming voice call -> ring extensions via Kamailio
;   sms-in        : cellular incoming SMS (chan_quectel sets ${SMS}/${SMS_BASE64})
;   messaging     : SIP MESSAGE from softphones -> SMS out via EC20
;
; Channel driver dial string is "Quectel/<device>/<number>" (capital Q; the
; device section name in quectel.conf is [ec20]).
; =============================================================================

[globals]
QUECTEL_DEV=ec20
KAMAILIO_URI=127.0.0.1:5060
SMS_FORWARD=/usr/local/sbin/sms_forward.sh
SMS_SEND=/usr/local/sbin/sms_send_cli.sh
EXT_RING=1001&1002

; ---- softphone dials a mobile/landline number --------------------------------
[from-kamailio]
exten => _X.,1,NoOp(PSTN call ${EXTEN} via Quectel/${QUECTEL_DEV})
 same => n,Dial(Quectel/${QUECTEL_DEV}/${EXTEN},60)
 same => n,Hangup()

; ---- cellular incoming voice call -> ring extensions ------------------------
; chan_quectel enters this context with exten = dnid or "s"; cover both.
[from-quectel]
exten => _X.,1,NoOp(Incoming mobile call from ${CALLERID(num)})
 same => n,Set(CALL_FROM=${CALLERID(num)})
 same => n,Dial(PJSIP/kamailio-trunk/sip:1001@${KAMAILIO_URI}&PJSIP/kamailio-trunk/sip:1002@${KAMAILIO_URI},30)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,System(${SMS_FORWARD} call "${CALL_FROM}")
 same => n(done),Hangup()
exten => s,1,NoOp(Incoming mobile call from ${CALLERID(num)})
 same => n,Set(CALL_FROM=${CALLERID(num)})
 same => n,Dial(PJSIP/kamailio-trunk/sip:1001@${KAMAILIO_URI}&PJSIP/kamailio-trunk/sip:1002@${KAMAILIO_URI},30)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,System(${SMS_FORWARD} call "${CALL_FROM}")
 same => n(done),Hangup()

; ---- cellular incoming SMS -> DingTalk/mail + inbox --------------------------
; chan_quectel variables: ${SMS} (utf-8), ${SMS_BASE64}, ${SMS_TS}, exten=sms
[sms-in]
exten => sms,1,NoOp(SMS from ${CALLERID(num)} at ${SMS_TS})
 same => n,System(${SMS_FORWARD} sms "${CALLERID(num)}" "${SMS_BASE64}")
 same => n,Hangup()

; ---- SIP MESSAGE from softphones -> SMS out ----------------------------------
; Body travels as base64 to survive commas/quotes inside dialplan args.
; sms_send_cli.sh decodes and calls: asterisk -rx "quectel sms ec20 <num> <text>"
[messaging]
exten => _X.,1,Set(SMS_B64=${BASE64_ENCODE(${MESSAGE(body)})})
 same => n,System(${SMS_SEND} "${EXTEN}" "${SMS_B64}")
 same => n,Hangup()
