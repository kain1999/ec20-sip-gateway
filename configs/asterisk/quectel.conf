; =============================================================================
; ec20-sip-gateway :: chan_quectel device config
; Placeholders are replaced by install.sh:
;   __AT_PORT__  -> /dev/ec20-at (udev) or /dev/ttyUSB2
;   __ALSADEV__  -> plughw:CARD=<EC20 UAC card name>,DEV=0
; UAC mode: quec_uac=1 + alsadev. Do NOT set audio= together with quec_uac=1
; (audio= is the legacy serial-PCM path, EC20 uses USB Audio Class).
; The driver arms AT+QPCMV=1,2 itself on dial/answer; hangup reset is ensured
; by patches/0001-quectel-reset-qpcmv-on-hangup.patch.
; =============================================================================

[general]
interval=15
smsdb=/var/lib/asterisk/smsdb
csmsttl=600

; small receive jitterbuffer helps cellular audio
jbenable=yes
jbmaxsize=200
jbresyncthreshold=300
jbimpl=fixed

[defaults]
context=from-quectel
group=0
rxgain=0
txgain=0
autodeletesms=yes
resetquectel=yes
u2diag=-1
usecallingpres=yes
callingpres=allowed_passed_screen
disablesms=no
language=en
mindtmfgap=45
mindtmfduration=80
mindtmfinterval=200
callwaiting=no
initstate=start
dtmf=relax

[ec20]
data=__AT_PORT__
quec_uac=1
alsadev=__ALSADEV__
