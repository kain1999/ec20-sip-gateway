; =============================================================================
; ec20-sip-gateway :: module loading policy
; The trim (source) build already ships a whitelisted set; the noload list below
; additionally slims the `apt` build down to the same footprint. Unknown names
; are ignored at load time, so this file is safe for both install modes.
; =============================================================================

[modules]
autoload=yes

; --- other channel drivers we never use --------------------------------------
noload => chan_iax2.so
noload => chan_sip.so
noload => chan_dahdi.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_phone.so
noload => chan_oss.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_bridge_media.so
noload => chan_local.so

; --- heavy apps / res we do not need ------------------------------------------
noload => app_voicemail.so
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so
noload => app_queue.so
noload => app_confbridge.so
noload => app_meetme.so
noload => app_page.so
noload => app_fax.so
noload => app_record.so
noload => app_dictate.so
noload => app_followme.so
noload => app_voicemail_v2.so

noload => res_xmpp.so
noload => res_ari.so
noload => res_ari_asterisk.so
noload => res_ari_channels.so
noload => res_ari_endpoints.so
noload => res_ari_events.so
noload => res_ari_model.so
noload => res_ari_playbacks.so
noload => res_ari_recordings.so
noload => res_ari_device_states.so
noload => res_stasis.so
noload => res_stasis_recording.so
noload => res_stasis_answer.so
noload => res_stasis_playback.so
noload => res_stasis_snoop.so
noload => res_stasis_device_state.so
noload => res_http_websocket.so
noload => res_phoneprov.so
noload => res_snmp.so
noload => res_odbc.so
noload => res_odbc_transaction.so
noload => res_fax.so
noload => res_fax_spandsp.so
noload => res_pktccops.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_musiconhold.so
noload => res_parking.so
noload => res_agi.so
noload => res_adsi.so
noload => res_smdi.so
noload => res_calendar.so
noload => res_corosync.so
noload => res_security_log.so
noload => res_statsd.so
; we never register to anyone and Kamailio owns registration serving
noload => res_pjsip_outbound_registration.so
noload => res_pjsip_registrar.so

; --- monitoring noise ----------------------------------------------------------
noload => res_clialiases.so
noload => res_clioriginate.so
