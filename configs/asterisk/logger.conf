; =============================================================================
; ec20-sip-gateway :: logging (low IO footprint for SD-card boards)
; =============================================================================
[general]

[logfiles]
; terminal (journalctl -u asterisk)
console => notice,warning,error
; the one file we keep (rotated by /etc/logrotate.d/ec20-gateway)
messages => notice,warning,error
; no debug/verbose/full files: saves SD wear and RAM
