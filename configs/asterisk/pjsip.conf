; =============================================================================
; ec20-sip-gateway :: PJSIP (Asterisk media gateway, Kamailio in front)
; Signalling: Kamailio (0.0.0.0:5060) <-> Asterisk (0.0.0.0:5062)
;   - Kamailio forwards PSTN-bound INVITE/MESSAGE here via dispatcher
;   - Asterisk sends cellular-incoming calls back to Kamailio via this endpoint
; Bind 0.0.0.0 (not 127.0.0.1) so SDP c= carries the real LAN IP for RTP;
; firewall 5062 if exposed (softphones only ever talk to 5060).
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5062
; NAT / public tunnel (FRP, port-forward): uncomment and set the public IP
; the softphone will see in SDP (e.g. your FRP VPS address). Only affects
; peers outside local_net below — LAN phones keep talking to LAN addresses.
; NOTE: with FRP the phone's SDP c= must point at the tunnel node so its RTP
; enters the tunnel; rtp_symmetric=yes handles the return path.
external_media_address=8.137.213.214
local_net=127.0.0.0/8
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

; ---- Kamailio trunk (identified by loopback source IP, no digest auth) ------
[kamailio-trunk]
type=endpoint
context=from-kamailio
message_context=messaging
disallow=all
allow=alaw
allow=ulaw
aors=kamailio-trunk
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[kamailio-trunk]
type=aor
contact=sip:127.0.0.1:5060
qualify_frequency=0

[kamailio-ident]
type=identify
endpoint=kamailio-trunk
match=127.0.0.1
