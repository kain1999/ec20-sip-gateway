; =============================================================================
; ec20-sip-gateway :: PJSIP (Asterisk media gateway, Kamailio in front)
; Signalling: Kamailio (0.0.0.0:5060) <-> Asterisk (0.0.0.0:5062)
;   - Kamailio forwards PSTN-bound INVITE/MESSAGE here via dispatcher
;   - Asterisk sends cellular-incoming calls back to Kamailio via this endpoint
; Bind 0.0.0.0 (not 127.0.0.1) so SDP c= carries the real LAN IP for RTP;
; firewall 5062 if exposed (softphones only ever talk to 5060).
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5062

; ---- Kamailio trunk (identified by loopback source IP, no digest auth) ------
[kamailio-trunk]
type=endpoint
context=from-kamailio
message_context=messaging
disallow=all
allow=alaw
allow=ulaw
aors=kamailio-trunk
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[kamailio-trunk]
type=aor
contact=sip:127.0.0.1:5060
qualify_frequency=0

[kamailio-ident]
type=identify
endpoint=kamailio-trunk
match=127.0.0.1
